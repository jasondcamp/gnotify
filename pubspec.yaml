name: gnotify
description: "macOS menubar app that watches GitHub for pull requests awaiting your review."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/logo.png
